[project]
name = "jarvis"
version = "0.1.0"
description = "Asystent głosowy Jarvis na Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
# openwakeword==0.4.0 instaluje scripts/install.sh bez zależności (nowsze chcą tflite-runtime).
pi = [
    "piper-tts>=1.3",
    "onnxruntime",
    "scipy",
    "scikit-learn",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis = "jarvis.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
