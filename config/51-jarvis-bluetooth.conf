# Jarvis: głośnik Bluetooth tylko jako głośnik (A2DP), bez trybu zestawu
# słuchawkowego. Inaczej po ponownym połączeniu JBL potrafi przejąć rolę
# mikrofonu i Jarvis przestaje słyszeć "hey Jarvis" z mikrofonu USB.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
