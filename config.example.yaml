# Skopiuj do config.yaml i dopasuj. config.yaml nie trafia do repo.
# Sekrety (klucze API) NIE tutaj, tylko w /etc/jarvis/env.

audio:
  input_device: null                     # null = domyślne wejście PipeWire; albo fragment nazwy z `python -m sounddevice`
  input_rate: null                       # null = natywna częstotliwość mikrofonu
  preroll_s: 1.0
  output_device: null                    # null = domyślne wyjście (JBL)
  output_rate: 22050
  bt_speaker: "70:99:1C:47:E0:1B"         # JBL Clip 3; Jarvis sam łączy go ponownie

wakeword:
  model: hey_jarvis
  threshold: 0.5

vad:
  silence_ms: 700          # ile ciszy kończy wypowiedź
  energy_threshold: 500    # stroimy: scripts/measure.py mic
  max_record_s: 12
  no_speech_timeout_s: 4

followup_s: 5

elevenlabs:
  voice_id: TX3LPaxmHKxFdv7VOQHJ   # Liam (wbudowany). Na planie Starter: polski Liam 4uhvFPkbY1bS6SM5NREF
  tts_model: eleven_flash_v2_5
  stt_model: scribe_v1
  language: pl
  quota_switch: 0.95

stt:
  engine: elevenlabs                # zapas: whisper_local
  whisper_cli: ~/whisper.cpp/build/bin/whisper-cli
  whisper_model: ~/whisper.cpp/models/ggml-base.bin
  language: pl
  threads: 4

brain:
  engine: claude_code
  claude_bin: claude
  model: haiku
  effort: low
  prompt_file: brain/jarvis_prompt.md
  workdir: ~/.jarvis-brain
  reset_after_s: 300
  warmup: false

tts:
  engine: elevenlabs                # zapas: piper_local
  piper_bin: .venv/bin/piper
  voice: models/pl_PL-darkman-medium.onnx
  mode: auto

metrics:
  path: ~/jarvis/logs/turns.jsonl
